name: Patch Exindokarsa lead
on:
  push:
    paths:
      - '.github/workflows/patch-exindokarsa.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lead
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/leads.json')
          data=json.loads(p.read_text())
          target='volza-id-exindokarsa-dates-20260331'
          for x in data:
              if x.get('id')==target:
                  x['source']='Volza Indonesia dates import analytics + EASTFOOD INDONESIA 2026 exhibitor listing'
                  x['sourceUrl']='https://eastfoodindonesia.com/detail-exhibitor/20503'
                  x['contact']='Current EASTFOOD 2026 exhibitor contact: modsales3@groupsra.com; official phone 021-8191908; website https://www.sumberrosoagro.com/. Ask for the purchasing/import manager for dates.'
                  x['next']='Email modsales3@groupsra.com and/or call +62 21 8191908, asking for the purchasing/import manager for dates. Reference their current Date Crown / Akram date portfolio and ask whether they are reviewing Iranian-origin soft, semi-moist or semi-dry dates for the next buying cycle. Confirm required variety/profile, grade, packing, volume and target arrival period before quoting; do not claim any Seventh Sky variety until availability is verified.'
                  x['notes']=(x.get('notes','')+' Material improvement verified 2026-08-21: EASTFOOD INDONESIA has a current 2026 exhibitor record for DATE CROWN (EXINDOKARSA AGUNG, PT), created/updated 2026-04-29, explicitly identifying the company as an importer & distributor of agricultural products including dates. The listing provides a current company email (modsales3@groupsra.com), official phone (021-8191908), website (sumberrosoagro.com), and a live 2026 date portfolio including Akram and Date Crown products. This upgrades the contact path from secondary directory/Linktree data to a current trade-show exhibitor contact, while the lead remains B because no live Iranian-origin RFQ is public.')
                  x['follow']='2026-08-21'
                  x['lastUpdate']='2026-08-21T04:07:14+03:30'
                  break
          else:
              raise SystemExit('target lead not found')
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name 'Seventh Sky Lead Radar'
          git config user.email 'actions@users.noreply.github.com'
          git add data/leads.json
          git diff --cached --quiet && exit 0
          git commit -m 'Improve Exindokarsa lead contact from EASTFOOD 2026'
          git push
