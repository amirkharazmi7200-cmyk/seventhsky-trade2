name: Command Center v4 Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'live/**'
      - 'data/leads.json'
      - '.github/workflows/inject-instant-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production entry and required v4 files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          grep -q 'command-center-v4-test.html' index.html
          for f in \
            live/command-center-v4-test.html \
            live/today-actions-v1.html \
            live/activity-hub-v1.html \
            live/negotiation-room-v1.html \
            live/pricing-engine-v1.html \
            live/contact-repair-v1.html \
            live/inbox-live-v1.html \
            live/reply-matcher-v1.html \
            data/leads.json; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
      - name: Validate leads JSON
        run: python -m json.tool data/leads.json >/dev/null
      - name: Guard against obsolete production entry
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "seventh-sky-command-center-live.html" index.html; then
            echo "Production index still points to legacy app"
            exit 1
          fi
      - name: Report external gates
        run: |
          echo "Static v4 smoke checks passed."
          echo "External runtime gates still require real execution: GitHub Pages/custom domain, Gmail->Make webhook, iPhone/PWA, and cross-device backend."