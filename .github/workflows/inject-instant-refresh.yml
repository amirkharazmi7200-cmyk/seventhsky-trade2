name: Command Center v4 Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'live/**'
      - 'data/leads.json'
      - 'backend-iranserver/**'
      - '.github/workflows/deploy-iranserver-backend.yml'
      - '.github/workflows/inject-instant-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production entry and required v4 files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -q 'command-center-v4-test.html' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'serviceWorker.register' index.html
          for f in \
            manifest.webmanifest \
            sw.js \
            live/command-center-v4-test.html \
            live/today-actions-v1.html \
            live/activity-hub-v1.html \
            live/negotiation-room-v1.html \
            live/pricing-engine-v1.html \
            live/contact-repair-v1.html \
            live/inbox-live-v1.html \
            live/reply-matcher-v1.html \
            live/backend-client-v1.js \
            live/backend-setup-v1.html \
            live/v4-readiness-check.html \
            backend-iranserver/index.php \
            backend-iranserver/install.php \
            backend-iranserver/schema.sql \
            backend-iranserver/config.example.php \
            backend-iranserver/.htaccess \
            .github/workflows/deploy-iranserver-backend.yml \
            data/leads.json; do
            test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
          done
      - name: Validate JSON assets
        run: |
          python -m json.tool data/leads.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Verify central backend package guards
        shell: bash
        run: |
          set -euo pipefail
          test ! -e backend-iranserver/config.php || { echo 'Private config.php must never be committed'; exit 1; }
          grep -q "resource === 'health'" backend-iranserver/index.php
          grep -q "resource === 'bootstrap'" backend-iranserver/index.php
          grep -q 'CREATE TABLE IF NOT EXISTS leads' backend-iranserver/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS crm_state' backend-iranserver/schema.sql
          grep -q 'backend-client-v1.js' live/command-center-v4-test.html
          grep -q 'backend-setup-v1.html' live/command-center-v4-test.html
          grep -q 'IRANSERVER_API_TOKEN' .github/workflows/deploy-iranserver-backend.yml
      - name: Verify push-capable service worker infrastructure
        shell: bash
        run: |
          set -euo pipefail
          grep -q "addEventListener('push'" sw.js
          grep -q "notificationclick" sw.js
      - name: Guard against obsolete production entry
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "seventh-sky-command-center-live.html" index.html; then
            echo "Production index still points to legacy app"
            exit 1
          fi
      - name: Report external gates
        run: |
          echo "Static v4 + PWA + IranServer backend package smoke checks passed."
          echo "External runtime gates still require real execution: GitHub Pages/custom domain, IranServer deploy/database health, Gmail->Make->backend, push sender/subscription/device, and central CRM cross-device verification."