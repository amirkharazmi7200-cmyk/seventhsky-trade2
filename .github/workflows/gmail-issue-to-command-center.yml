name: Gmail Issue to Command Center

on:
  issues:
    types: [opened]

jobs:
  forward:
    if: startsWith(github.event.issue.title, '[GMAIL_EVENT]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Build and forward payload
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          ISSUE_ID: ${{ github.event.issue.id }}
          CREATED_AT: ${{ github.event.issue.created_at }}
        run: |
          rest="${TITLE#'[GMAIL_EVENT] '}"
          from_email="${rest%% ||| *}"
          subject="${rest#* ||| }"
          payload=$(jq -n \
            --arg source "gmail" \
            --arg external_id "$ISSUE_ID" \
            --arg thread_id "" \
            --arg from_name "" \
            --arg from_email "$from_email" \
            --arg subject "$subject" \
            --arg snippet "$BODY" \
            --arg received_at "$CREATED_AT" \
            '{source:$source,external_id:$external_id,thread_id:$thread_id,from_name:$from_name,from_email:$from_email,subject:$subject,snippet:$snippet,received_at:$received_at}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://app.7skytrade.com/api-proxy.php?resource=inbox'
      - name: Close bridge issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --repo "$REPO" --comment 'Forwarded to Seventh Sky Command Center.'
