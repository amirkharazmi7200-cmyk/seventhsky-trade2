name: Seventh Sky Market Radar Poller v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-radar-poller-v2.yml'
      - 'tools/market_radar.py'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seventh-sky-market-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Discover, deduplicate, store and verify buyer signals
        env:
          RADAR_API_BASE: https://app.7skytrade.com/api-proxy.php
          RADAR_MAX_AGE_DAYS: '180'
          RADAR_MAX_RESULTS: '40'
        run: python tools/market_radar.py

      - name: Confirm approval-only outreach policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"requiresApproval": True' tools/market_radar.py
          grep -q '"autoSend": False' tools/market_radar.py
          if grep -Eqi 'sendgrid|smtp|twilio|whatsapp.*api|mailgun' tools/market_radar.py; then
            echo 'Outbound messaging integration is not allowed in the radar poller.'
            exit 1
          fi
          echo 'Radar is discovery-only; outreach remains approval-gated and manually sent.'
