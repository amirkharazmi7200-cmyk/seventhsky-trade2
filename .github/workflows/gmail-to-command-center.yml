name: Gmail to Command Center

on:
  repository_dispatch:
    types: [gmail_inbox_event]

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Forward Gmail event to Command Center
        env:
          EVENT_ID: ${{ github.event.client_payload.external_id }}
          THREAD_ID: ${{ github.event.client_payload.thread_id }}
          FROM_NAME: ${{ github.event.client_payload.from_name }}
          FROM_EMAIL: ${{ github.event.client_payload.from_email }}
          SUBJECT: ${{ github.event.client_payload.subject }}
          SNIPPET: ${{ github.event.client_payload.snippet }}
          RECEIVED_AT: ${{ github.event.client_payload.received_at }}
        run: |
          payload=$(jq -n \
            --arg messageKey "$EVENT_ID" \
            --arg source "gmail" \
            --arg id "$EVENT_ID" \
            --arg threadId "$THREAD_ID" \
            --arg fromName "$FROM_NAME" \
            --arg fromEmail "$FROM_EMAIL" \
            --arg subject "$SUBJECT" \
            --arg snippet "$SNIPPET" \
            --arg receivedAt "$RECEIVED_AT" \
            '{messageKey:$messageKey,source:$source,id:$id,threadId:$threadId,fromName:$fromName,fromEmail:$fromEmail,subject:$subject,snippet:$snippet,receivedAt:$receivedAt}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://app.7skytrade.com/api-proxy.php?resource=inbox'
