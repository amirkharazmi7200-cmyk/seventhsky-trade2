<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7Sky CRM Smoke Test</title><style>body{font-family:Tahoma,Arial;background:#07101c;color:#eef6ff;padding:20px}.c{max-width:680px;margin:auto;background:#101f31;border:1px solid #203247;border-radius:16px;padding:16px}button{width:100%;padding:12px;border-radius:10px;border:0;font-weight:700}pre{white-space:pre-wrap;background:#08131f;padding:12px;border-radius:10px;min-height:160px;color:#91a6bb}.ok{color:#8cf0bc}.bad{color:#ff9aa7}</style></head><body><div class="c"><h2>Command Center CRM Smoke Test</h2><p>Health → Leads → State write/read → Activity write/read. تست روی Lead سیستمی انجام می‌شود.</p><button id="go">شروع تست</button><pre id="out">آماده.</pre></div><script src="backend-client-v2.js"></script><script>const out=document.getElementById('out'),go=document.getElementById('go');const log=(s,c='')=>{out.className=c;out.textContent=s};go.onclick=async()=>{go.disabled=true;let lines=[];const add=s=>{lines.push(s);log(lines.join('\n'))};try{add('1) Health...');await SevenSkyAPI.health();add('✓ Backend connected');if(!SevenSkyAPI.configured())throw Error('API Token missing');add('2) Leads...');const leads=await SevenSkyAPI.getLeads();if(!leads.length)throw Error('No leads');add('✓ '+leads.length+' leads read');const lead=leads.find(x=>/^test[-_]/i.test(String(x.id||''))||/^test\b/i.test(String(x.company||'')))||leads[0];add('3) CRM state write/read on '+lead.id+'...');const original=await SevenSkyAPI.getState(lead.id);const marker='smoke-'+Date.now();const test={...(original||{}),_smokeMarker:marker,updatedAt:new Date().toISOString()};await SevenSkyAPI.saveState(lead.id,test);const read=await SevenSkyAPI.getState(lead.id);if(read?._smokeMarker!==marker)throw Error('State round-trip mismatch');add('✓ State persistence verified');await SevenSkyAPI.saveState(lead.id,original||{});add('✓ Original state restored');add('4) Activity write/read...');await SevenSkyAPI.addActivity(lead.id,'system_smoke_test',{title:'System smoke test',detail:marker});const acts=await SevenSkyAPI.getActivities(lead.id);if(!acts.some(a=>a.kind==='system_smoke_test'&&JSON.stringify(a.data||{}).includes(marker)))throw Error('Activity round-trip mismatch');add('✓ Activity persistence verified');log(lines.join('\n')+'\n\nALL TESTS PASSED ✓','ok')}catch(e){log(lines.join('\n')+'\n✗ '+e.message,'bad')}finally{go.disabled=false}};</script></body></html>
