<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>Seventh Sky Command Center</title><style>:root{--bg:#07101c;--card:#0d1b2b;--card2:#101f31;--line:#203247;--txt:#eef6ff;--mut:#91a6bb;--good:#8cf0bc;--bad:#ff9aa7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:14px 12px 80px}.top,.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:18px;margin:0}.mut{color:var(--mut)}.mini{font-size:11px}.pill,.tag{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px}.good{color:var(--good);border-color:#285c45}.bad{color:var(--bad);border-color:#66343b}.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:#08131f;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi span{font-size:9px;color:var(--mut)}.kpi b{display:block;font-size:22px;margin-top:5px}.search{width:100%;background:#08131f;border:1px solid var(--line);color:white;border-radius:10px;padding:10px;font:inherit}.filters,.actions,.meta{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#102033;color:white;border-radius:9px;padding:7px 9px;text-decoration:none;font-size:10px;cursor:pointer}.primary,.filter.active{background:#174b3a;border-color:#2a765b}.buyer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-top:1px solid var(--line)}.buyer:first-child{border-top:0}.buyer h3{font-size:13px;margin:0 0 6px}.next{margin-top:7px;color:var(--mut);font-size:10px;line-height:1.6}.error{color:var(--bad)}@media(max-width:760px){.buyer{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.actions{justify-content:flex-start}}</style></head><body><main class="wrap"><div class="top"><div><h1>Seventh Sky Command Center</h1><div class="mut mini">Buyer Operations • Central MySQL</div></div><span id="backend" class="pill">Backend: checking…</span></div><section class="card"><div class="head"><b>Lead KPIs</b><span class="mut mini">TEST excluded from real totals</span></div><div class="kpis" style="margin-top:10px"><div class="kpi"><span>TOTAL REAL</span><b id="total">—</b></div><div class="kpi"><span>A SCORE</span><b id="aScore">—</b></div><div class="kpi"><span>CONTACTED</span><b id="contacted">—</b></div><div class="kpi"><span>NEGOTIATING</span><b id="negotiating">—</b></div></div></section><section class="card"><div class="head"><b>Buyer Inbox</b><span id="count" class="mut mini"></span></div><input id="search" class="search" style="margin-top:9px" placeholder="جستجو شرکت، کشور، محصول، منبع…"><div class="filters" style="margin-top:8px"><button class="btn filter active" data-filter="all">همه</button><button class="btn filter" data-filter="A">Score A</button><button class="btn filter" data-filter="action">Need Action</button><button class="btn filter" data-filter="contacted">Contacted</button><button class="btn filter" data-filter="negotiating">Negotiating</button></div><div id="buyers"><div class="mut mini" style="padding:20px;text-align:center">در حال دریافت لیدها…</div></div></section></main><script src="backend-client-v2.js"></script><script>const $=id=>document.getElementById(id);let leads=[],states={},mode='all';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function isTest(x){return /^test[-_]/i.test(String(x.id||''))||/^test\b/i.test(String(x.company||''))||/system test/i.test([x.source,x.notes,x.product].join(' '))}function contacts(x){const c=String(x.contact||''),email=(c.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'',raw=(c.match(/\+?\d[\d\s().-]{7,}\d/)||[])[0]||'',digits=raw.replace(/\D/g,'');return{email,phone:digits.length>=10&&digits.length<=15?digits:''}}function current(x){const s=states[x.id]||{};return{...x,status:s.status||x.status||'New',next:s.next??x.next??'',follow:s.follow??x.follow??'',notes:s.notes??x.notes??''}}function statusNorm(s){const x=String(s||'').toLowerCase();if(x==='action')return'need action';return x}function filtered(){const term=$('search').value.toLowerCase();return leads.map(current).filter(x=>{const txt=[x.company,x.country,x.product,x.source,x.contact,x.status,x.next].join(' ').toLowerCase();if(term&&!txt.includes(term))return false;const st=statusNorm(x.status);if(mode==='A'&&x.score!=='A')return false;if(mode==='action'&&!/action|reply|quote|need action/.test(st))return false;if(mode==='contacted'&&!st.includes('contact'))return false;if(mode==='negotiating'&&!st.includes('negoti'))return false;return true})}function render(){const arr=filtered();$('count').textContent=arr.length+' lead';$('buyers').innerHTML=arr.map(x=>{const c=contacts(x),st=x.status||'New';return `<div class="buyer"><div><h3>${esc(x.company||'Unknown Buyer')}</h3><div class="meta"><span class="tag">Score ${esc(x.score||'—')}</span><span class="tag">${esc(x.country||'—')}</span><span class="tag">${esc(x.product||'—')}</span><span class="tag">${esc(st)}</span></div><div class="next">Next: ${esc(x.next||'—')}${x.follow?' • Follow: '+esc(x.follow):''}</div></div><div class="actions">${c.email?`<a class="btn" href="mailto:${esc(c.email)}">Email</a>`:''}${c.phone?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${c.phone}">WhatsApp</a>`:''}<a class="btn primary" href="negotiation-room.html?lead=${encodeURIComponent(x.id)}">Open CRM</a></div></div>`}).join('')||'<div class="mut mini" style="padding:20px;text-align:center">نتیجه‌ای نیست.</div>'}function kpis(){const cur=leads.map(current),real=cur.filter(x=>!isTest(x));$('total').textContent=real.length;$('aScore').textContent=real.filter(x=>x.score==='A').length;$('contacted').textContent=real.filter(x=>statusNorm(x.status).includes('contact')).length;$('negotiating').textContent=real.filter(x=>statusNorm(x.status).includes('negoti')).length}async function load(){try{await SevenSkyAPI.health();$('backend').textContent='Backend: Connected';$('backend').classList.add('good')}catch(e){$('backend').textContent='Backend: Unreachable';$('backend').classList.add('bad');throw e}if(!SevenSkyAPI.configured())throw Error('API Token در این مرورگر پیدا نشد');leads=await SevenSkyAPI.getLeads();const pairs=await Promise.all(leads.map(async l=>{try{return[l.id,await SevenSkyAPI.getState(l.id)]}catch(e){return[l.id,null]}}));states=Object.fromEntries(pairs.filter(x=>x[1]));kpis();render()}$('search').addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.filter;render()});window.addEventListener('focus',()=>load().catch(()=>{}));load().catch(e=>{$('buyers').innerHTML='<div class="error mini" style="padding:20px">خطا: '+esc(e.message)+'</div>'});</script></body></html>
