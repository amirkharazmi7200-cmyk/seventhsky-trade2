<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>Seventh Sky Reply Matcher</title><style>:root{--p:#0d1b2b;--line:#203247;--txt:#eef6ff;--mut:#91a6bb}*{box-sizing:border-box}body{margin:0;background:#07101c;color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:900px;margin:auto;padding:15px 12px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.mut{color:var(--mut)}.mini{font-size:11px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px}.ok{color:#8cf0bc;border-color:#285c45}.warn{color:#ffd17e;border-color:#66552c}.bad{color:#ff9aa7;border-color:#66343b}.btn{border:1px solid var(--line);background:#102033;color:white;border-radius:9px;padding:8px 10px;text-decoration:none;font-size:10px;cursor:pointer}.primary{background:#174b3a;border-color:#2a765b}.mail{direction:ltr;text-align:left;background:#08131f;border:1px solid var(--line);border-radius:11px;padding:11px;line-height:1.7}.candidate{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-top:1px solid var(--line)}.candidate:first-child{border-top:0}</style></head><body><main class="wrap"><div class="head"><div><h2 style="margin:0;font-size:18px">Reply Matcher</h2><div class="mut mini">Match محافظه‌کارانه + جلوگیری از ثبت دوباره یک ایمیل</div></div><span class="pill" id="state">WAITING</span></div><section class="card"><b>آخرین پیام دریافت‌شده</b><div id="mail" class="mail" style="margin-top:9px">هنوز پیام موفقی ثبت نشده.</div></section><section class="card"><div class="head"><b>Buyer Match</b><span class="mut mini" id="reason"></span></div><div id="matches"><div class="mut mini" style="padding:15px">در انتظار داده…</div></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let mail=null,leads=[];try{mail=JSON.parse(localStorage.getItem('7skyLastInboxWebhook')||'null')?.data||null}catch(e){}function isTest(x){return /^test[-_]/i.test(String(x.id||''))||/^test\b/i.test(String(x.company||''))||/system test/i.test([x.product,x.notes,x.source].join(' '))}function emailOf(s){return((String(s||'').match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||'').toLowerCase()}function domain(e){return(e.split('@')[1]||'').toLowerCase()}function genericDomain(d){return['gmail.com','yahoo.com','hotmail.com','outlook.com','icloud.com','aol.com','proton.me','protonmail.com'].includes(d)}function messageId(){const raw=mail?.id||mail?.messageId||mail?.threadId||[mail?.fromEmail,mail?.subject,mail?.date].join('|');let h=2166136261;for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619)}return 'm'+(h>>>0).toString(16)}function processed(){try{return JSON.parse(localStorage.getItem('7skyInboundMatch:'+messageId())||'null')}catch(e){return null}}function scoreLead(x){const sender=emailOf(mail?.fromEmail||''),contact=emailOf(x.contact),sd=domain(sender),cd=domain(contact);let score=0,reasons=[];if(sender&&contact&&sender===contact){score=100;reasons.push('Exact email')}else if(sd&&cd&&sd===cd&&!genericDomain(sd)){score=80;reasons.push('Same business email domain')}const hay=[x.company,x.contact,x.notes].join(' ').toLowerCase(),name=String(mail?.fromName||'').toLowerCase().trim();if(name&&name.length>3&&hay.includes(name)){score=Math.max(score,60);reasons.push('Sender name appears in lead')}return{score,reasons}}function attach(x){const old=processed();if(old){$('state').textContent='ALREADY ATTACHED';$('state').className='pill warn';$('reason').textContent='این پیام قبلاً به '+(old.company||old.leadId)+' وصل شده است.';return}const key='7skyLeadRoom:'+x.id;let d={};try{d=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}d.status='Replied';d.next='Review buyer reply and respond';d.notes=d.notes??x.notes??'';d.events=Array.isArray(d.events)?d.events:[];d.events.push({t:'Inbound email matched',d:`${new Date().toLocaleString()} • ${mail.subject||'(no subject)'} • ${mail.fromEmail||''} • ${mail.snippet||''}`});d.updatedAt=new Date().toISOString();localStorage.setItem(key,JSON.stringify(d));localStorage.setItem('7skyMatchedReply:'+x.id,JSON.stringify({matchedAt:d.updatedAt,messageKey:messageId(),mail}));localStorage.setItem('7skyInboundMatch:'+messageId(),JSON.stringify({leadId:x.id,company:x.company||'',matchedAt:d.updatedAt}));location.href='negotiation-room-v1.html?lead='+encodeURIComponent(x.id)}function render(){if(!mail){$('state').textContent='NO LIVE MAIL';$('state').className='pill warn';$('reason').textContent='اول Live Inbox Test باید پاسخ موفق ثبت کند.';$('matches').innerHTML='<div class="mut mini" style="padding:15px">ایمیل Live برای Match وجود ندارد.</div>';return}const old=processed(),sender=emailOf(mail.fromEmail)||mail.fromEmail||'unknown';$('mail').innerHTML=`<b>${esc(mail.subject||'(no subject)')}</b><div>From: ${esc(sender)}</div><div>ID: ${esc(mail.id||mail.threadId||messageId())}</div><div>${esc(mail.snippet||'')}</div>`;if(old){$('state').textContent='ALREADY ATTACHED';$('state').className='pill warn';$('reason').textContent='این پیام قبلاً به '+(old.company||old.leadId)+' وصل شده است.';$('matches').innerHTML=`<a class="btn" href="negotiation-room-v1.html?lead=${encodeURIComponent(old.leadId)}">Open Attached Buyer</a>`;return}const ranked=leads.map(x=>({x,...scoreLead(x)})).filter(r=>r.score>0).sort((a,b)=>b.score-a.score),high=ranked.filter(r=>r.score>=80);if(high.length===1){$('state').textContent='HIGH CONFIDENCE';$('state').className='pill ok';$('reason').textContent=high[0].reasons.join(' + ')}else if(ranked.length){$('state').textContent='REVIEW REQUIRED';$('state').className='pill warn';$('reason').textContent=high.length>1?'چند Match قوی؛ انتخاب خودکار ممنوع.':'Match قطعی نیست.'}else{$('state').textContent='NO MATCH';$('state').className='pill bad';$('reason').textContent='Sender در CRM پیدا نشد.'}$('matches').innerHTML=ranked.slice(0,10).map(r=>`<div class="candidate"><div><b>${esc(r.x.company||'Unknown')}</b><div class="mut mini">${esc(r.x.country||'—')} • Match ${r.score} • ${esc(r.reasons.join(', '))}</div></div>${r.score>=80&&high.length===1?`<button class="btn primary" data-id="${esc(r.x.id)}">Attach Reply</button>`:`<a class="btn" href="negotiation-room-v1.html?lead=${encodeURIComponent(r.x.id)}">Review Buyer</a>`}</div>`).join('')||'<div class="mut mini" style="padding:15px">کاندیدایی پیدا نشد؛ ایمیل خودکار وصل نمی‌شود.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const x=leads.find(l=>String(l.id)===b.dataset.id);if(x)attach(x)})}fetch('../data/leads.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{leads=(Array.isArray(d)?d:[]).filter(x=>!isTest(x));render()}).catch(render);</script></body></html>
