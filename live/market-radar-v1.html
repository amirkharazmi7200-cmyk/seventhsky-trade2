<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101c"><title>رصد بازار — Seventh Sky</title><style>:root{--bg:#07101c;--p:#0d1b2b;--p2:#101f31;--line:#203247;--txt:#eef6ff;--mut:#91a6bb;--ok:#8cf0bc;--warn:#ffd17e;--bad:#ff9aa7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:14px 12px 90px}.top,.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:18px;margin:0}.mut{color:var(--mut)}.mini{font-size:11px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#08131f;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi span{font-size:9px;color:var(--mut)}.kpi b{display:block;font-size:21px;margin-top:6px}.signal{padding:13px 0;border-top:1px solid var(--line)}.signal:first-child{border-top:0}.signal h3{font-size:14px;margin:0 0 6px}.tags,.actions{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:var(--mut)}.a{color:var(--ok);border-color:#285c45}.btn{border:1px solid var(--line);background:#102033;color:white;border-radius:9px;padding:8px 10px;text-decoration:none;font-size:10px;display:inline-block;cursor:pointer}.primary{background:#174b3a;border-color:#2a765b}.danger{background:#3b1b23;border-color:#67313d}.msg{background:#08131f;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:11px;line-height:1.8;white-space:pre-wrap}.search{width:100%;background:#08131f;border:1px solid var(--line);color:white;border-radius:10px;padding:10px;font:inherit;margin-top:8px}.empty{padding:24px;text-align:center;color:var(--mut);font-size:11px}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>رصد بازار</h1><div class="mut mini">کشف Buyer و سیگنال خرید؛ ارسال فقط با تأیید شما</div></div><a class="btn" href="command-center-v4-test.html">مرکز فرمان</a></div><section class="card"><div class="head"><b>وضعیت رادار</b><span class="mut mini" id="updated">—</span></div><div class="kpis" style="margin-top:10px"><div class="kpi"><span>سیگنال جدید</span><b id="total">0</b></div><div class="kpi"><span>اولویت A</span><b id="aCount">0</b></div><div class="kpi"><span>قابل تماس</span><b id="contactable">0</b></div><div class="kpi"><span>نیاز به بررسی</span><b id="review">0</b></div></div></section><section class="card"><div class="head"><b>فرصت‌های کشف‌شده</b><span class="mut mini">جدیدترین‌ها اول</span></div><input id="search" class="search" placeholder="جستجو در شرکت، کشور، منبع، متن سیگنال…"><div id="list"><div class="empty">در حال دریافت رادار…</div></div></section></main><script src="backend-client-v1.js"></script><script>const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function emailOf(c){return (String(c||'').match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[])[0]||''}function phoneOf(c){const raw=(String(c||'').match(/\+?\d[\d\s().-]{7,}\d/)||[])[0]||'';const d=raw.replace(/\D/g,'');return d.length>=10&&d.length<=15?d:''}function msg(x){const company=x.company||'there';return `Hello ${company},\n\nI’m Amir from Seventh Sky Trade. We supply Iranian dates directly from Bushehr, including Kabkab and other export grades. I came across your recent market activity and thought there may be a fit.\n\nIf you are currently sourcing dates, I can send our available grades, packing options, MOQ and quotation.\n\nBest regards,\nAmir\nSeventh Sky Trade`}function safeUrl(u){try{const z=new URL(u);return /^https?:$/.test(z.protocol)}catch(e){return false}}let rows=[];function render(){const q=$('search').value.toLowerCase();const arr=rows.filter(x=>[x.company,x.country,x.source,x.product,x.notes,x.intent].join(' ').toLowerCase().includes(q));$('list').innerHTML=arr.map(x=>{const e=emailOf(x.contact),p=phoneOf(x.contact),m=msg(x),wa=p?`https://wa.me/${p}?text=${encodeURIComponent(m)}`:'',mail=e?`mailto:${encodeURIComponent(e)}?subject=${encodeURIComponent('Iranian Dates Supply — Seventh Sky Trade')}&body=${encodeURIComponent(m)}`:'';return `<article class="signal"><h3>${esc(x.company||'سیگنال بازار')}</h3><div class="tags"><span class="tag ${x.score==='A'?'a':''}">اولویت ${esc(x.score||'B')}</span><span class="tag">${esc(x.country||'—')}</span><span class="tag">${esc(x.product||'خرما')}</span><span class="tag">${esc(x.source||'Market Radar')}</span>${x.publishedAt?`<span class="tag">${esc(x.publishedAt)}</span>`:''}</div><div class="mut mini" style="margin-top:8px;line-height:1.8">${esc(x.notes||x.next||'سیگنال جدید؛ منبع را بررسی کنید.')}</div><div class="msg">${esc(m)}</div><div class="actions" style="margin-top:9px">${safeUrl(x.sourceUrl)?`<a class="btn" target="_blank" rel="noopener" href="${esc(x.sourceUrl)}">دیدن منبع</a>`:''}${wa?`<a class="btn primary" target="_blank" rel="noopener" href="${wa}">پیام در واتس‌اپ</a>`:''}${mail?`<a class="btn primary" href="${mail}">ایمیل آماده</a>`:''}<a class="btn" href="negotiation-room-v1.html?lead=${encodeURIComponent(x.id||'')}">باز کردن پرونده</a></div>${!e&&!p?'<div class="mut mini" style="margin-top:8px">اطلاعات تماس مستقیم پیدا نشده؛ فعلاً منبع و پرونده برای اقدام دستی ثبت شده است.</div>':''}</article>`}).join('')||'<div class="empty">هنوز سیگنال راداری در دیتابیس نیست.</div>'}async function load(){try{let d=[];if(window.SevenSkyBackend?.configured())d=await window.SevenSkyBackend.getLeads();else{const r=await fetch('../data/leads.json?ts='+Date.now(),{cache:'no-store'});d=await r.json()}rows=(Array.isArray(d)?d:[]).filter(x=>x.radar===true||String(x.id||'').startsWith('radar-')).sort((a,b)=>String(b._serverUpdatedAt||b.publishedAt||'').localeCompare(String(a._serverUpdatedAt||a.publishedAt||'')));$('total').textContent=rows.length;$('aCount').textContent=rows.filter(x=>x.score==='A').length;$('contactable').textContent=rows.filter(x=>emailOf(x.contact)||phoneOf(x.contact)).length;$('review').textContent=rows.filter(x=>!emailOf(x.contact)&&!phoneOf(x.contact)).length;$('updated').textContent=new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date());render()}catch(e){$('list').innerHTML='<div class="empty">خطا در دریافت داده‌های رادار.</div>'}}$('search').addEventListener('input',render);load();setInterval(load,60000);</script></body></html>
