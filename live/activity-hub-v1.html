<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>Seventh Sky Activity Hub</title><style>:root{--p:#0d1b2b;--p2:#101f31;--line:#203247;--txt:#eef6ff;--mut:#91a6bb}*{box-sizing:border-box}body{margin:0;background:#07101c;color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:15px 12px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h1{font-size:18px;margin:0}.mut{color:var(--mut)}.mini{font-size:10px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.pipe{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.stage{background:#08131f;border:1px solid var(--line);border-radius:12px;padding:10px}.stage span{font-size:9px;color:var(--mut)}.stage b{display:block;font-size:20px;margin-top:5px}.event{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.event:first-child{border-top:0}.event h3{font-size:12px;margin:0 0 5px}.tag,.btn{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:9px;color:var(--mut);text-decoration:none}.btn{border-radius:9px;color:white;background:#102033}.green{color:#8cf0bc}.red{color:#ff9aa7;border-color:#66343b}.amber{color:#ffd17e}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{cursor:pointer}.active{background:#174b3a!important;border-color:#2a765b!important}.urgent{background:#1b1118;border-radius:11px;padding:9px!important}@media(max-width:800px){.pipe{grid-template-columns:repeat(3,1fr)}.event{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>Sales Activity Hub</h1><div class="mut mini">Pipeline واقعی؛ CRM محلی + Follow-up جاری؛ System Test حذف</div></div><span class="tag green">● v4</span></div><section class="card"><div class="head"><b>Pipeline Snapshot</b><span class="mut mini" id="excluded"></span></div><div class="pipe" style="margin-top:10px"><div class="stage"><span>NEW / ACTION</span><b id="new">0</b></div><div class="stage"><span>CONTACTED</span><b id="contacted">0</b></div><div class="stage"><span>WAITING</span><b id="waiting">0</b></div><div class="stage"><span>REPLIED</span><b id="replied">0</b></div><div class="stage"><span>NEGOTIATING</span><b id="neg">0</b></div><div class="stage"><span>QUOTE / WON</span><b id="quote">0</b></div><div class="stage"><span>OVERDUE</span><b id="overdue">0</b></div></div></section><section class="card"><div class="head"><b>Buyer Activity</b><div class="filters"><button class="btn active" data-f="all">همه</button><button class="btn" data-f="active">فعال</button><button class="btn" data-f="overdue">Overdue</button><button class="btn" data-f="events">Timeline</button></div></div><div id="list"><div class="mut mini" style="padding:20px;text-align:center">در حال خواندن پرونده‌ها…</div></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let leads=[],mode='all';function isTest(x){const id=String(x.id||'').toLowerCase(),company=String(x.company||'').toLowerCase(),blob=[x.source,x.status,x.notes,x.product].join(' ').toLowerCase();return id.startsWith('test-')||id.startsWith('test_')||company.startsWith('test ')||blob.includes('system test')}function state(x){let d=null,p=null;try{d=JSON.parse(localStorage.getItem('7skyLeadRoom:'+x.id)||'null')}catch(e){}try{p=JSON.parse(localStorage.getItem('7skyLatestPricing:'+x.id)||'null')}catch(e){}return{status:d?.status||x.status||'New',next:d?.next??x.next??'—',follow:d?.follow??x.follow??'',updatedAt:d?.updatedAt||x.lastUpdate||'',events:Array.isArray(d?.events)?d.events:[],pricing:p}}function bucket(s){s=String(s).toLowerCase();if(s.includes('won')||s.includes('quote'))return'quote';if(s.includes('negoti'))return'neg';if(s.includes('replied'))return'replied';if(s.includes('waiting'))return'waiting';if(s.includes('contacted'))return'contacted';return'new'}function localDay(v){const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d.getTime())?null:d}function isOverdue(st){const d=localDay(st.follow);if(!d)return false;const today=new Date();today.setHours(0,0,0,0);return !/won|lost/i.test(st.status)&&d<today}function render(){let rows=leads.map(x=>({x,st:state(x)}));rows.forEach(r=>r.over=isOverdue(r.st));['new','contacted','waiting','replied','neg','quote'].forEach(k=>$(k).textContent=rows.filter(r=>bucket(r.st.status)===k).length);$('overdue').textContent=rows.filter(r=>r.over).length;if(mode==='active')rows=rows.filter(r=>['waiting','replied','neg','quote'].includes(bucket(r.st.status))&&!/won|lost/i.test(r.st.status));if(mode==='events')rows=rows.filter(r=>r.st.events.length);if(mode==='overdue')rows=rows.filter(r=>r.over);const rank={replied:0,neg:1,quote:2,waiting:3,contacted:4,new:5};rows.sort((a,b)=>(Number(b.over)-Number(a.over))||(rank[bucket(a.st.status)]-rank[bucket(b.st.status)]));$('list').innerHTML=rows.map(r=>`<div class="event ${r.over?'urgent':''}"><div><h3>${esc(r.x.company||'Unknown Buyer')}</h3><div class="filters"><span class="tag">${esc(r.x.country||'—')}</span><span class="tag ${bucket(r.st.status)==='replied'?'green':''}">${esc(r.st.status)}</span><span class="tag">Events ${r.st.events.length}</span>${r.st.follow?`<span class="tag ${r.over?'red':'amber'}">Follow ${esc(r.st.follow)}</span>`:''}${r.st.pricing?`<span class="tag green">Pricing ${esc(r.st.pricing.scenario||'ready')}</span>`:''}${r.over?'<span class="tag red">OVERDUE</span>':''}</div><div class="mut mini" style="margin-top:6px">Next: ${esc(r.st.next)}</div></div><a class="btn" href="negotiation-room-v1.html?lead=${encodeURIComponent(r.x.id)}">Open Buyer</a></div>`).join('')||'<div class="mut mini" style="padding:20px">موردی نیست.</div>'}fetch('../data/leads.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const all=Array.isArray(d)?d:[],tests=all.filter(isTest);leads=all.filter(x=>!isTest(x));$('excluded').textContent=tests.length?tests.length+' test record excluded':'';render()}).catch(()=>{$('list').innerHTML='<div class="mut mini">خطا در leads.json</div>'});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.f;render()});</script></body></html>
