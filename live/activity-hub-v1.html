<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>Seventh Sky Activity Hub</title><style>:root{--p:#0d1b2b;--p2:#101f31;--line:#203247;--txt:#eef6ff;--mut:#91a6bb;--g:#2bd585}*{box-sizing:border-box}body{margin:0;background:#07101c;color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:1100px;margin:auto;padding:15px 12px 80px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h1{font-size:18px;margin:0}.mut{color:var(--mut)}.mini{font-size:10px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.stage{background:#08131f;border:1px solid var(--line);border-radius:12px;padding:10px}.stage span{font-size:9px;color:var(--mut)}.stage b{display:block;font-size:20px;margin-top:5px}.event{padding:11px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.event:first-child{border-top:0}.event h3{font-size:12px;margin:0 0 5px}.tag,.btn{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:9px;color:var(--mut);text-decoration:none}.btn{border-radius:9px;color:white;background:#102033}.green{color:#8cf0bc}.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{cursor:pointer}.active{background:#174b3a!important;border-color:#2a765b!important}@media(max-width:700px){.pipe{grid-template-columns:repeat(3,1fr)}.event{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>Sales Activity Hub</h1><div class="mut mini">نمای کل مذاکره‌ها و فعالیت‌های ذخیره‌شده روی این دستگاه</div></div><span class="tag green">● v1</span></div><section class="card"><div class="head"><b>Pipeline Snapshot</b><span class="mut mini">Lead data + local CRM state</span></div><div class="pipe" style="margin-top:10px"><div class="stage"><span>NEW / ACTION</span><b id="new">0</b></div><div class="stage"><span>CONTACTED</span><b id="contacted">0</b></div><div class="stage"><span>WAITING</span><b id="waiting">0</b></div><div class="stage"><span>REPLIED</span><b id="replied">0</b></div><div class="stage"><span>NEGOTIATING</span><b id="neg">0</b></div><div class="stage"><span>QUOTE / WON</span><b id="quote">0</b></div></div></section><section class="card"><div class="head"><b>Buyer Activity</b><div class="filters"><button class="btn active" data-f="all">همه</button><button class="btn" data-f="active">فعال</button><button class="btn" data-f="events">دارای Timeline</button></div></div><div id="list"><div class="mut mini" style="padding:20px;text-align:center">در حال خواندن پرونده‌ها…</div></div></section></main><script>const $=x=>document.getElementById(x);let leads=[],mode='all';function state(x){let d=null;try{d=JSON.parse(localStorage.getItem('7skyLeadRoom:'+x.id)||'null')}catch(e){}const raw=d?.status||x.status||'New',s=String(raw).toLowerCase();return{status:raw,next:d?.next||x.next||'—',events:Array.isArray(d?.events)?d.events:[]}}function bucket(s){s=String(s).toLowerCase();if(s.includes('won')||s.includes('quote'))return'quote';if(s.includes('negoti'))return'neg';if(s.includes('replied'))return'replied';if(s.includes('waiting'))return'waiting';if(s.includes('contacted'))return'contacted';return'new'}function render(){const rows=leads.map(x=>({x,st:state(x)}));['new','contacted','waiting','replied','neg','quote'].forEach(k=>$(k).textContent=rows.filter(r=>bucket(r.st.status)===k).length);let arr=rows;if(mode==='active')arr=arr.filter(r=>['waiting','replied','neg','quote'].includes(bucket(r.st.status)));if(mode==='events')arr=arr.filter(r=>r.st.events.length);arr.sort((a,b)=>{const rank={replied:0,neg:1,quote:2,waiting:3,contacted:4,new:5};return rank[bucket(a.st.status)]-rank[bucket(b.st.status)]});$('list').innerHTML=arr.map(r=>`<div class="event"><div><h3>${r.x.company||'Unknown Buyer'}</h3><div class="filters"><span class="tag">${r.x.country||'—'}</span><span class="tag">${r.st.status}</span><span class="tag">Events ${r.st.events.length}</span></div><div class="mut mini" style="margin-top:6px">Next: ${r.st.next}</div></div><a class="btn" href="negotiation-room-v1.html?lead=${encodeURIComponent(r.x.id)}">Open Buyer</a></div>`).join('')||'<div class="mut mini" style="padding:20px">موردی نیست.</div>'}fetch('../data/leads.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{leads=Array.isArray(d)?d:[];render()}).catch(()=>{$('list').innerHTML='<div class="mut mini">خطا در leads.json</div>'});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.f;render()});</script></body></html>
