<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101c"><title>Seventh Sky Today Actions</title><style>:root{--bg:#07101c;--p:#0d1b2b;--p2:#101f31;--line:#203247;--txt:#eef6ff;--mut:#91a6bb;--g:#2bd585;--a:#f7bb4d;--r:#ff6b7d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#10233a,#07101c 42%);color:var(--txt);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:15px 12px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h1{font-size:18px;margin:0}.mut{color:var(--mut)}.mini{font-size:11px}.pill{border:1px solid #285c45;color:#8cf0bc;background:#0c2b21;border-radius:999px;padding:6px 9px;font-size:10px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#08131f;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi span{font-size:9px;color:var(--mut)}.kpi b{display:block;font-size:20px;margin-top:6px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task input{width:18px;height:18px}.task h3{font-size:13px;margin:0 0 5px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--mut);font-size:9px}.high{color:#ff8b99}.med{color:#ffd17e}.btn{border:1px solid var(--line);background:#102033;color:white;border-radius:10px;padding:7px 9px;font:inherit;font-size:10px;text-decoration:none}.add{display:flex;gap:7px;margin-top:10px}.add input{flex:1;background:#08131f;border:1px solid var(--line);border-radius:10px;padding:10px;color:white;font:inherit}.done{opacity:.45;text-decoration:line-through}@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.task{grid-template-columns:auto 1fr}.task>.btn{grid-column:2}}</style></head><body><main class="wrap"><div class="head"><div><h1>Today's Actions</h1><div class="mut mini">کارهایی که مستقیماً فروش را جلو می‌برند</div></div><span class="pill">● Priority Engine v1</span></div><section class="card"><div class="kpis"><div class="kpi"><span>OPEN</span><b id="open">0</b></div><div class="kpi"><span>HIGH</span><b id="high">0</b></div><div class="kpi"><span>BUYER ACTIONS</span><b id="buyer">0</b></div><div class="kpi"><span>DONE TODAY</span><b id="done">0</b></div></div></section><section class="card"><div class="head"><b>صف اقدام امروز</b><span class="mut mini">High → Medium → Normal</span></div><div id="list"></div><div class="add"><input id="newTask" placeholder="اقدام جدید…"><button class="btn" id="add">+ اضافه</button></div></section></main><script>const base=[{id:'price',t:'قیمت و شرایط تأمین واقعی را قطعی کن',p:'high',type:'supply',next:'قیمت خرید، گرید، MOQ و ظرفیت'},{id:'a-leads',t:'لیدهای دارای مسیر تماس واقعی را جلو ببر',p:'high',type:'buyer',next:'اولین تماس / Follow-up'},{id:'supplier',t:'چارچوب Pilot Order با تأمین‌کننده باتجربه',p:'med',type:'supply',next:'کیفیت، ظرفیت، اولویت تأمین'},{id:'linkedin',t:'پروفایل و مسیر LinkedIn فروش را تکمیل کن',p:'normal',type:'buyer',next:'Decision makers'},{id:'b2b',t:'ثبت و بررسی B2Bهای مرتبط بازار هدف',p:'normal',type:'buyer',next:'Market coverage'}];let data;try{data=JSON.parse(localStorage.getItem('7skyTodayV1')||'null')||base}catch(e){data=base}const $=x=>document.getElementById(x);function save(){localStorage.setItem('7skyTodayV1',JSON.stringify(data))}function render(){const rank={high:0,med:1,normal:2};data.sort((a,b)=>(a.done?1:0)-(b.done?1:0)||rank[a.p]-rank[b.p]);$('list').innerHTML='';data.forEach(x=>{const d=document.createElement('div');d.className='task'+(x.done?' done':'');d.innerHTML=`<input type="checkbox" ${x.done?'checked':''}><div><h3>${x.t}</h3><div class="tags"><span class="tag ${x.p==='high'?'high':x.p==='med'?'med':''}">${x.p.toUpperCase()}</span><span class="tag">${x.type}</span><span class="tag">Next: ${x.next||'—'}</span></div></div>${x.type==='buyer'?'<a class="btn" href="negotiation-room-v1.html">Open CRM</a>':'<a class="btn" href="pricing-engine-v1.html">Open Tool</a>'}`;d.querySelector('input').onchange=e=>{x.done=e.target.checked;save();render()};$('list').appendChild(d)});$('open').textContent=data.filter(x=>!x.done).length;$('high').textContent=data.filter(x=>!x.done&&x.p==='high').length;$('buyer').textContent=data.filter(x=>!x.done&&x.type==='buyer').length;$('done').textContent=data.filter(x=>x.done).length}$('add').onclick=()=>{const t=$('newTask').value.trim();if(!t)return;data.push({id:Date.now(),t,p:'normal',type:'manual',next:'Manual'});$('newTask').value='';save();render()};render();</script></body></html>
