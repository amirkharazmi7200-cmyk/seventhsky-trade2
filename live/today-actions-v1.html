<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101c"><title>Seventh Sky Today Actions</title><style>:root{--p:#0d1b2b;--p2:#101f31;--line:#203247;--txt:#eef6ff;--mut:#91a6bb}*{box-sizing:border-box}body{margin:0;background:#07101c;color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:920px;margin:auto;padding:15px 12px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h1{font-size:18px;margin:0}.mut{color:var(--mut)}.mini{font-size:11px}.pill,.tag{border:1px solid #285c45;color:#8cf0bc;border-radius:999px;padding:6px 9px;font-size:10px}.tag{border-color:var(--line);color:var(--mut);padding:4px 7px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.kpi{background:#08131f;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi span{font-size:9px;color:var(--mut)}.kpi b{display:block;font-size:20px;margin-top:6px}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task input{width:18px;height:18px}.task h3{font-size:13px;margin:0 0 5px}.tags{display:flex;gap:5px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#102033;color:white;border-radius:10px;padding:7px 9px;font-size:10px;text-decoration:none}.add{display:flex;gap:7px;margin-top:10px}.add input{flex:1;background:#08131f;border:1px solid var(--line);border-radius:10px;padding:10px;color:white}.done{opacity:.42}.done h3{text-decoration:line-through}.sectionTitle{margin:14px 0 2px;font-size:11px}.warn{color:#ff9aa7}.amber{color:#ffd17e}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.task{grid-template-columns:auto 1fr}.task>.btn{grid-column:2}}</style></head><body><main class="wrap"><div class="head"><div><h1>Today's Actions</h1><div class="mut mini">Reply / Quote request → Overdue → Negotiation → A-score → Contact Research</div></div><span class="pill">● DYNAMIC v4</span></div><section class="card"><div class="kpis"><div class="kpi"><span>OPEN</span><b id="open">0</b></div><div class="kpi"><span>URGENT</span><b id="high">0</b></div><div class="kpi"><span>BUYERS</span><b id="buyer">0</b></div><div class="kpi"><span>VERIFY CONTACT</span><b id="verify">0</b></div><div class="kpi"><span>DONE</span><b id="done">0</b></div></div></section><section class="card"><div id="list"><div class="mut mini" style="padding:20px;text-align:center">در حال ساخت صف…</div></div><div class="add"><input id="newTask" placeholder="کار دستی جدید…"><button class="btn" id="add">+ اضافه</button></div></section></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let leads=[],manual=[];try{manual=JSON.parse(localStorage.getItem('7skyManualTasksV2')||'[]')}catch(e){}let doneMap={};try{doneMap=JSON.parse(localStorage.getItem('7skyDoneActionsV2')||'{}')}catch(e){}function isTest(x){return /^test[-_]/i.test(String(x.id||''))||/system test/i.test([x.product,x.notes,x.source].join(' '))||/^test\b/i.test(String(x.company||''))}function crm(x){let d={};try{d=JSON.parse(localStorage.getItem('7skyLeadRoom:'+x.id)||'{}')}catch(e){}return{...x,status:d.status||x.status||'New',next:d.next??x.next??'',follow:d.follow??x.follow??'',updatedAt:d.updatedAt||x.lastUpdate||''}}function ci(x){const c=String(x.contact||''),email=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(c),raw=(c.match(/\+?\d[\d\s().-]{7,}\d/)||[])[0]||'',d=raw.replace(/\D/g,'');return{ok:email||(d.length>=10&&d.length<=15)}}function localDay(v){const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d.getTime())?null:d}function overdue(x){if(!x.follow||/won|lost/i.test(x.status))return false;const d=localDay(x.follow);return !!d&&d.getTime()<new Date().setHours(0,0,0,0)}function priority(x){const s=String(x.status||'').toLowerCase(),next=String(x.next||'').toLowerCase(),blob=(s+' '+next).toLowerCase();if(s.includes('repl')||next.includes('reply')||/quote|proforma|sample|price request|quotation/.test(blob))return 0;if(overdue(x)||s==='action'||s.includes('negoti'))return 1;if(x.score==='A'&&ci(x).ok)return 2;if(!ci(x).ok)return 3;return 4}function build(){const buyers=leads.map(crm).map(x=>({id:'lead:'+x.id,t:x.company||'Unknown buyer',p:priority(x),type:'buyer',next:x.next||x.follow||'Review lead',lead:x,over:overdue(x),done:!!doneMap['lead:'+x.id]})).filter(x=>x.p<=3);const fixed=[{id:'fixed:pricing',t:'به‌روزرسانی ورودی‌های واقعی Pricing Engine',p:1,type:'supply',next:'قیمت خرید، هزینه‌ها، FX',done:!!doneMap['fixed:pricing']},{id:'fixed:market',t:'گسترش منابع کشف Buyer جدید',p:3,type:'market',next:'B2B / Google / LinkedIn / Trade Data',done:!!doneMap['fixed:market']}];return[...buyers,...fixed,...manual].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||a.p-b.p)}function render(){const data=build();$('list').replaceChildren();let last=-1;const names=['فوری: Reply / Quote / Sample','فوری: Overdue / مذاکره','A-score قابل تماس','Contact Research'];data.forEach(x=>{if(x.p!==last){const h=document.createElement('div');h.className='sectionTitle '+(x.p<=1?'warn':x.p===2?'amber':'');h.textContent=names[x.p]||'Manual';$('list').appendChild(h);last=x.p}const d=document.createElement('div');d.className='task'+(x.done?' done':'');const meta=x.lead?[x.lead.country,x.lead.product,x.lead.score?'Score '+x.lead.score:'',x.lead.status,x.over?'OVERDUE':''].filter(Boolean):[x.type];d.innerHTML=`<input type="checkbox" ${x.done?'checked':''}><div><h3>${esc(x.t)}</h3><div class="tags">${meta.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}<span class="tag">Next: ${esc(x.next||'—')}</span></div></div>${x.lead?`<a class="btn" href="${x.p===3?'contact-repair-v1.html?lead='+encodeURIComponent(x.lead.id):'negotiation-room-v1.html?lead='+encodeURIComponent(x.lead.id)}">${x.p===3?'Repair Contact':'Open Buyer'}</a>`:x.type==='supply'?'<a class="btn" href="pricing-engine-v1.html">Pricing</a>':'<a class="btn" href="contact-repair-v1.html">Research</a>'}`;d.querySelector('input').onchange=e=>{x.done=e.target.checked;if(String(x.id).startsWith('manual:')){const m=manual.find(a=>a.id===x.id);if(m)m.done=x.done;localStorage.setItem('7skyManualTasksV2',JSON.stringify(manual))}else{doneMap[x.id]=x.done;localStorage.setItem('7skyDoneActionsV2',JSON.stringify(doneMap))}render()};$('list').appendChild(d)});$('open').textContent=data.filter(x=>!x.done).length;$('high').textContent=data.filter(x=>!x.done&&x.p<=1).length;$('buyer').textContent=data.filter(x=>!x.done&&x.type==='buyer').length;$('verify').textContent=data.filter(x=>!x.done&&x.p===3&&x.type==='buyer').length;$('done').textContent=data.filter(x=>x.done).length}fetch('../data/leads.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{leads=(Array.isArray(d)?d:[]).filter(x=>!isTest(x));render()}).catch(()=>{$('list').innerHTML='<div class="warn mini" style="padding:20px">leads.json دریافت نشد.</div>'});$('add').onclick=()=>{const t=$('newTask').value.trim();if(!t)return;manual.push({id:'manual:'+Date.now(),t,p:2,type:'manual',next:'Manual',done:false});localStorage.setItem('7skyManualTasksV2',JSON.stringify(manual));$('newTask').value='';render()};</script></body></html>
