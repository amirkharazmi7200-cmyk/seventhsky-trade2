<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101c"><title>Seventh Sky Contact Repair</title><style>:root{--p:#0d1b2b;--line:#203247;--txt:#eef6ff;--mut:#91a6bb}*{box-sizing:border-box}body{margin:0;background:#07101c;color:var(--txt);font-family:Tahoma,Arial}.wrap{max-width:950px;margin:auto;padding:15px 12px 80px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:11px}.mut{color:var(--mut)}.mini{font-size:10px}.tag,.btn{border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:9px;color:var(--mut);text-decoration:none}.btn{color:#fff;background:#102033}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row h3{margin:0 0 6px;font-size:12px}.meta,.actions{display:flex;gap:5px;flex-wrap:wrap}.a{color:#8cf0bc}.warn{color:#ff9aa7}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kpi{background:#08131f;border:1px solid var(--line);border-radius:11px;padding:10px}.kpi span{font-size:9px;color:var(--mut)}.kpi b{display:block;font-size:20px;margin-top:5px}@media(max-width:600px){.row{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="head"><div><h2 style="margin:0;font-size:18px">Contact Repair Queue</h2><div class="mut mini">لید حذف نمی‌شود؛ اطلاعات تماس ناقص تبدیل به کار تحقیق می‌شود.</div></div><span class="tag warn">VERIFY</span></div><section class="card"><div class="kpis"><div class="kpi"><span>NEED RESEARCH</span><b id="need">—</b></div><div class="kpi"><span>SCORE A</span><b id="a">—</b></div><div class="kpi"><span>SOURCE AVAILABLE</span><b id="src">—</b></div></div></section><section class="card"><div id="list"><div class="mut mini">در حال خواندن لیدها…</div></div></section></main><script>const $=x=>document.getElementById(x);function info(x){const c=String(x.contact||''),email=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i.test(c),raw=(c.match(/\+?\d[\d\s().-]{7,}\d/)||[])[0]||'',d=raw.replace(/\D/g,'');return{ok:email||(d.length>=10&&d.length<=15),raw}}function safeUrl(u){try{const x=new URL(u);return['http:','https:'].includes(x.protocol)}catch(e){return false}}fetch('../data/leads.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{const rows=(Array.isArray(d)?d:[]).filter(x=>!info(x).ok).sort((a,b)=>(a.score==='A'?-1:0)-(b.score==='A'?-1:0));$('need').textContent=rows.length;$('a').textContent=rows.filter(x=>x.score==='A').length;$('src').textContent=rows.filter(x=>safeUrl(x.sourceUrl)).length;$('list').innerHTML=rows.map(x=>`<div class="row"><div><h3>${x.company||'Unknown Buyer'}</h3><div class="meta"><span class="tag ${x.score==='A'?'a':''}">Score ${x.score||'—'}</span><span class="tag">${x.country||'—'}</span><span class="tag">${x.source||'—'}</span></div><div class="mut mini" style="margin-top:6px">Current contact: ${x.contact||'none'}</div><div class="warn mini">کار بعدی: پیدا کردن وب‌سایت رسمی / ایمیل تجاری / شماره معتبر؛ بدون حدس.</div></div><div class="actions">${safeUrl(x.sourceUrl)?`<a class="btn" target="_blank" rel="noopener" href="${x.sourceUrl}">Open Source</a>`:''}<a class="btn" href="negotiation-room-v1.html?lead=${encodeURIComponent(x.id)}">CRM</a></div></div>`).join('')||'<div class="mut mini">همه لیدها Contact قابل استفاده دارند.</div>'}).catch(()=>{$('list').innerHTML='<div class="warn mini">leads.json دریافت نشد.</div>'});</script></body></html>
