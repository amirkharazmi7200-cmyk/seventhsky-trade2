<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seventh Sky Lead Import v2</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0d10;color:#f4f4f4;margin:0;padding:24px}.wrap{max-width:680px;margin:auto}.card{background:#14181d;border:1px solid #2b3138;border-radius:18px;padding:20px}h1{font-size:22px;margin-top:0}p{line-height:1.8;color:#c9ced5}input,button{width:100%;box-sizing:border-box;border-radius:12px;padding:14px;margin-top:10px;font-size:16px}input{background:#0d1116;color:#fff;border:1px solid #39414a}button{border:0;background:#e8e8e8;color:#111;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.ok{color:#74d99f}.bad{color:#ff8b8b}.muted{color:#a8b0ba}pre{white-space:pre-wrap;word-break:break-word;background:#0d1116;padding:14px;border-radius:12px;min-height:110px}</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Import لیدهای Seventh Sky — v2</h1>
<p>این نسخه اول Raw GitHub را امتحان می‌کند، بعد GitHub API را؛ اگر هر دو از شبکه مسدود باشند، می‌توانی فایل <code>leads.json</code> را از گوشی انتخاب کنی.</p>
<input id="token" type="password" placeholder="API Token">
<input id="file" type="file" accept="application/json,.json">
<button id="go">شروع Import و تست</button>
<pre id="out">آماده.</pre>
</div></div>
<script>
const RAW='https://raw.githubusercontent.com/amirkharazmi7200-cmyk/seventhsky-trade2/main/data/leads.json';
const GHAPI='https://api.github.com/repos/amirkharazmi7200-cmyk/seventhsky-trade2/contents/data/leads.json';
const API='https://command.7skytrade.com/index.php';
const tokenEl=document.getElementById('token'),fileEl=document.getElementById('file'),out=document.getElementById('out'),go=document.getElementById('go');
tokenEl.value=localStorage.getItem('7skyApiToken')||localStorage.getItem('seventhSkyApiToken')||'';
function show(s,cls=''){out.className=cls;out.textContent=s}
async function loadLocal(){const f=fileEl.files&&fileEl.files[0];if(!f)return null;const txt=await f.text();const d=JSON.parse(txt);if(!Array.isArray(d)||!d.length)throw Error('فایل محلی leads.json معتبر نیست');return d}
async function loadRaw(){const r=await fetch(RAW,{cache:'no-store'});if(!r.ok)throw Error('Raw GitHub HTTP '+r.status);const d=await r.json();if(!Array.isArray(d)||!d.length)throw Error('Raw GitHub data invalid');return d}
async function loadApi(){const r=await fetch(GHAPI,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!r.ok)throw Error('GitHub API HTTP '+r.status);const j=await r.json();if(!j.content)throw Error('GitHub API content missing');const binary=atob(j.content.replace(/\n/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const txt=new TextDecoder('utf-8').decode(bytes);const d=JSON.parse(txt);if(!Array.isArray(d)||!d.length)throw Error('GitHub API data invalid');return d}
async function getLeads(){const local=await loadLocal();if(local){show('فایل محلی انتخاب شد؛ '+local.length+' لید پیدا شد.');return {leads:local,source:'Local file'}};try{show('۱) تلاش از Raw GitHub...');const d=await loadRaw();return {leads:d,source:'Raw GitHub'}}catch(e1){show('Raw GitHub در دسترس نبود.\n۲) تلاش از GitHub API...');try{const d=await loadApi();return {leads:d,source:'GitHub API'}}catch(e2){throw Error('دریافت خودکار لیدها شکست خورد.\nRaw: '+e1.message+'\nAPI: '+e2.message+'\n\nفایل data/leads.json را در قسمت انتخاب فایل بده و دوباره بزن.')}}}
go.onclick=async()=>{const token=tokenEl.value.trim();if(!token){show('API Token پیدا نشد.','bad');return}go.disabled=true;try{const {leads,source}=await getLeads();show('۳) '+leads.length+' لید از '+source+' دریافت شد.\nدر حال ارسال به Backend...');const b=await fetch(API+'?resource=bootstrap',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({leads})});const bt=await b.text();let bd={};try{bd=JSON.parse(bt)}catch(e){}if(!b.ok||bd.ok===false)throw Error(bd.error||bt||('Backend HTTP '+b.status));show('۴) Bootstrap موفق بود.\nدر حال خواندن مجدد از MySQL...');const v=await fetch(API+'?resource=leads',{headers:{Accept:'application/json',Authorization:'Bearer '+token},cache:'no-store'});const vt=await v.text();let vd={};try{vd=JSON.parse(vt)}catch(e){}if(!v.ok||vd.ok===false)throw Error(vd.error||vt||('Verify HTTP '+v.status));const saved=Array.isArray(vd.leads)?vd.leads.length:0;show('موفق ✓\nمنبع: '+source+'\nلیدهای ارسال‌شده: '+leads.length+'\nلیدهای خوانده‌شده از MySQL: '+saved+'\n\nحالا app.7skytrade.com را Refresh کن.','ok')}catch(e){show('خطا ✗\n'+e.message,'bad')}finally{go.disabled=false}};
</script></body></html>
