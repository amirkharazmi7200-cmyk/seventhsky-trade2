<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Seventh Sky Command Center</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101c}#app{border:0;width:100%;height:100%;display:block;background:#07101c}.sync{position:fixed;z-index:9999;left:10px;top:calc(env(safe-area-inset-top) + 8px);font:11px Tahoma,Arial,sans-serif;color:#91a6bb;background:rgba(7,16,28,.9);border:1px solid #203247;border-radius:999px;padding:6px 9px;backdrop-filter:blur(10px);max-width:65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sync.ok{color:#8cf0bc;border-color:#235b45}.sync.err{color:#ff9b9b;border-color:#6c3030}
</style>
</head>
<body>
<div id="sync" class="sync">در حال اتصال Live…</div>
<iframe id="app" title="Seventh Sky Command Center"></iframe>
<script>
(function(){
 const LIVE='https://hook.us2.make.com/c9s7ispjfmypxsqlo81yytccgaqgbw1w';
 const frame=document.getElementById('app');
 const sync=document.getElementById('sync');
 let lastLoad=0, refreshing=false;
 function loadApp(){lastLoad=Date.now();frame.src='./live/seventh-sky-command-center-live.html?fresh='+lastLoad;}
 function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
 function injectMail(d){
   try{
     const doc=frame.contentDocument;if(!doc)return false;
     const home=doc.getElementById('home');if(!home)return false;
     let c=doc.getElementById('liveMailInstant');
     if(!c){c=doc.createElement('div');c.id='liveMailInstant';c.className='card';c.style.marginTop='12px';const hero=home.querySelector('.hero');if(hero)hero.insertAdjacentElement('afterend',c);else home.prepend(c);}
     c.innerHTML='<div class="section-head"><h2>Inbox Live</h2><span class="countdot">همین الان</span></div>'+(d&&d.id?'<div class="buyer"><div><h3>'+esc(d.subject||'بدون عنوان')+'</h3><div class="meta"><span class="tag">'+esc(d.fromName||d.fromEmail||'Email')+'</span><span class="tag scoreA">LIVE</span></div><div class="next">'+esc(d.snippet||'')+'</div></div></div>':'<div class="muted mini">در ۷ روز اخیر ایمیل مرتبط جدیدی پیدا نشد.</div>');
     return true;
   }catch(e){return false;}
 }
 async function refresh(reason){
   if(refreshing)return; refreshing=true;
   sync.className='sync';sync.textContent='در حال آپدیت…';
   try{
     const sep=LIVE.includes('?')?'&':'?';
     const r=await fetch(LIVE+sep+'t='+Date.now()+'&reason='+encodeURIComponent(reason||'launch'),{method:'GET',cache:'no-store',mode:'cors',credentials:'omit',headers:{'Accept':'application/json'}});
     if(!r.ok)throw new Error('HTTP '+r.status);
     const d=await r.json();
     let tries=0; const put=()=>{if(injectMail(d)||tries++>20)return;setTimeout(put,150)}; put();
     sync.className='sync ok';sync.textContent='● Live '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
   }catch(e){
     sync.className='sync err';sync.textContent='Live وصل نشد — تلاش مجدد';
     setTimeout(()=>refresh('retry'),5000);
   }finally{refreshing=false;}
 }
 frame.addEventListener('load',()=>refresh('frame-load'));
 window.addEventListener('pageshow',()=>refresh('pageshow'));
 window.addEventListener('focus',()=>refresh('focus'));
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(Date.now()-lastLoad>30000)loadApp();refresh('visible');}});
 setInterval(()=>{if(!document.hidden)refresh('interval');},60000);
 loadApp();
 refresh('startup');
})();
</script>
</body>
</html>
