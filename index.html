<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101c">
<title>Seventh Sky Command Center</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101c}#app{border:0;width:100%;height:100%;display:block;background:#07101c}.sync{position:fixed;z-index:9999;left:10px;top:calc(env(safe-area-inset-top) + 8px);font:11px Tahoma,Arial,sans-serif;color:#91a6bb;background:rgba(7,16,28,.9);border:1px solid #203247;border-radius:999px;padding:6px 9px;backdrop-filter:blur(10px);max-width:65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sync.ok{color:#8cf0bc;border-color:#235b45}.sync.err{color:#ffd17e;border-color:#5d4922}
</style>
</head>
<body>
<div id="sync" class="sync">Live sync…</div>
<iframe id="app" title="Seventh Sky Command Center"></iframe>
<script>
(function(){
 const LIVE='https://hook.us2.make.com/c9s7ispjfmypxsqlo81yytccgaqgbw1w';
 const frame=document.getElementById('app');
 const sync=document.getElementById('sync');
 let lastLoad=0;
 function loadApp(){lastLoad=Date.now();frame.src='./live/seventh-sky-command-center-live.html?v='+lastLoad;}
 function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}
 function injectMail(d){
   try{
     const doc=frame.contentDocument;if(!doc)return;
     const home=doc.getElementById('home');if(!home)return;
     let c=doc.getElementById('liveMailInstant');
     if(!c){c=doc.createElement('div');c.id='liveMailInstant';c.className='card';c.style.marginTop='12px';const hero=home.querySelector('.hero');if(hero)hero.insertAdjacentElement('afterend',c);else home.prepend(c);}
     c.innerHTML='<div class="section-head"><h2>Inbox Live</h2><span class="countdot">همین الان</span></div>'+(d&&d.id?'<div class="buyer"><div><h3>'+esc(d.subject||'بدون عنوان')+'</h3><div class="meta"><span class="tag">'+esc(d.fromName||d.fromEmail||'Email')+'</span><span class="tag scoreA">LIVE</span></div><div class="next">'+esc(d.snippet||'')+'</div></div></div>':'<div class="muted mini">در ۷ روز اخیر ایمیل مرتبط جدیدی پیدا نشد.</div>');
   }catch(e){}
 }
 async function refresh(){
   sync.className='sync';sync.textContent='در حال آپدیت…';
   try{
     const r=await fetch(LIVE+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
     const d=await r.json();injectMail(d);
     sync.className='sync ok';sync.textContent='● Live '+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'});
   }catch(e){sync.className='sync err';sync.textContent='Sync retry';}
 }
 frame.addEventListener('load',refresh);
 window.addEventListener('focus',refresh);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(Date.now()-lastLoad>60000)loadApp();else refresh();}});
 setInterval(()=>{if(!document.hidden)refresh();},60000);
 loadApp();
})();
</script>
</body>
</html>
